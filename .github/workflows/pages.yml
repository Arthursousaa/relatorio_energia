name: Compilar e publicar o Relatório GD

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Preparar o pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Instalar as dependências
        run: pnpm install --frozen-lockfile

      - name: Validar o projeto
        run: |
          pnpm test
          pnpm check

      - name: Gerar a versão publicada
        run: pnpm build

      - name: Preparar a publicação
        uses: actions/configure-pages@v5

      - name: Enviar os arquivos prontos
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
